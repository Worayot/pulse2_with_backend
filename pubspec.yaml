name: tuh_mews
description: "TUH MEWS Project"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.1.2+18

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  bcrypt: ^1.1.3
  async: ^2.11.0
  easy_localization: ^3.0.7+1
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  web_socket_channel: ^3.0.2
  flutter_client_sse: ^2.0.3
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  flutter_secure_storage: ^9.2.4
  flutter_slidable: ^3.1.1
  firebase_database: ^11.3.3
  cloud_firestore: ^5.6.4
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  font_awesome_flutter: ^10.8.0
  csv: ^6.0.0
  http: ^1.3.0
  collection: ^1.19.1
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  open_file: ^3.5.10
  uuid: ^4.5.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  url_launcher: ^6.3.1
  another_flushbar: ^1.12.30
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^3.1.0
  dio: ^5.9.0
  json_serializable: ^6.9.5
  json_annotation: ^4.9.0
  flutter_easyloading: ^3.0.5
  gap: ^3.0.1
  crypto: ^3.0.6
  upgrader: ^12.2.0
  share_plus: ^12.0.1
  rxdart: ^0.28.0
  dropdown_search: ^7.0.0
  table_calendar: ^3.2.0
  draggable_float_widget: ^0.1.0
  googleapis_auth: ^2.3.0
  cloud_functions: ^5.6.2
  flutter_timezone: ^5.0.2
  google_fonts: ^8.1.0
  excel: ^4.0.6
  file_picker: ^11.0.2

dev_dependencies:
  change_app_package_name: ^1.5.0
  freezed: ^3.1.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  riverpod_generator: ^2.6.5
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
  assets:
    - lang/en-US.json
    - lang/th-TH.json
    - assets/
    - assets/images/
    - assets/icons/
    - assets/images/flags/
    - assets/images/emojis/
    - assets/quotes/quotes.json
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Bold.otf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  generate: true
