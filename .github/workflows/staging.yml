name: Staging Deployment
on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS IPA
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_CONTENT: ${{ secrets.APP_STORE_KEY_CONTENT }}
        run: |
          echo "$APP_STORE_KEY_CONTENT" > ios/api_key.p8
          
          flutter build ipa --release \
            --export-method=app-store \
            --authentication-key-id=$APP_STORE_KEY_ID \
            --authentication-key-issuer-id=$APP_STORE_ISSUER_ID \
            --authentication-key-path=ios/api_key.p8
      - name: Deploy iOS to TestFlight
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_CONTENT: ${{ secrets.APP_STORE_KEY_CONTENT }}
        run: |
          cd ios
          bundle exec fastlane distribute_staging

      - name: Deploy Android to Firebase
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          cd android
          echo "$FIREBASE_CREDENTIALS" > firebase-key.json
          bundle exec fastlane distribute_staging